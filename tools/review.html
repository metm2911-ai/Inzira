<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inzira · Kugenzura ibibazo (review)</title>
<style>
  :root { --bg:#0f1420; --card:#171d2b; --line:#28303f; --text:#e8edf6; --muted:#93a0b5; --brand:#3b82f6; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:#121826ee; backdrop-filter:blur(8px); border-bottom:1px solid var(--line); padding:12px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  .wrap { display:grid; grid-template-columns: 380px 1fr; gap:0; height:calc(100vh - 57px); }
  .list { overflow:auto; border-right:1px solid var(--line); }
  .row { padding:10px 14px; border-bottom:1px solid var(--line); cursor:pointer; }
  .row:hover { background:#1b2233; }
  .row.active { background:#1f2a44; }
  .row .t { font-size:13px; color:var(--muted); display:flex; gap:8px; align-items:center; }
  .row .q { font-size:14px; margin-top:2px; }
  .pill { font-size:11px; padding:1px 7px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .pill.verified { color:var(--ok); border-color:#1c5b45; }
  .pill.edited { color:var(--brand); border-color:#1e3a6b; }
  .pill.bad_options, .pill.needs_key { color:var(--warn); border-color:#5b4a1c; }
  .pill.hidden { color:var(--bad); border-color:#5b2020; }
  .editor { overflow:auto; padding:20px 24px; }
  label { display:block; font-size:12px; color:var(--muted); margin:14px 0 4px; text-transform:uppercase; letter-spacing:.04em; }
  textarea, input, select { width:100%; background:#0c111b; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:9px 11px; font:inherit; }
  textarea { resize:vertical; min-height:60px; }
  .opt-row { display:flex; gap:9px; align-items:center; margin-bottom:7px; }
  .opt-row input[type=radio] { width:auto; }
  .opt-row .letter { width:20px; text-align:center; color:var(--muted); }
  .btns { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
  button { background:var(--brand); color:#fff; border:0; border-radius:10px; padding:9px 15px; font:inherit; cursor:pointer; }
  button.ghost { background:#1c2333; color:var(--text); border:1px solid var(--line); }
  button.danger { background:#7f1d1d; }
  .orig { font-size:12px; color:var(--muted); background:#0c111b; border:1px dashed var(--line); border-radius:10px; padding:10px; white-space:pre-wrap; }
  .note { font-size:13px; color:var(--muted); }
  .imgrow { display:flex; gap:14px; align-items:flex-start; }
  .imgrow .thumb { width:120px; height:120px; border:1px solid var(--line); border-radius:10px; background:#0c111b; display:flex; align-items:center; justify-content:center; overflow:hidden; flex:0 0 auto; }
  .imgrow .thumb img { max-width:100%; max-height:100%; }
  .imgrow .thumb span { color:var(--muted); font-size:12px; }
  .imgrow .imgctl { flex:1; display:flex; flex-direction:column; gap:7px; }
  input[type=file] { padding:7px; background:#0c111b; }
  .banner { background:#3b2f12; border:1px solid #6b561c; color:#fde68a; padding:10px 14px; border-radius:10px; margin-bottom:8px; font-size:13px; }
  .empty { padding:40px; color:var(--muted); }
  .goto { position:sticky; bottom:0; background:var(--bg); padding-top:10px; }
</style>
</head>
<body>
<header>
  <h1>Inzira · Kugenzura ibibazo</h1>
  <input id="search" placeholder="Shakisha ijambo mu kibazo…" style="max-width:280px">
  <select id="filter" style="max-width:190px">
    <option value="all">Byose (all)</option>
    <option value="verified">Verified</option>
    <option value="edited">Byahinduwe (edited)</option>
    <option value="attention">Bikeneye kwitabwaho (attention)</option>
    <option value="hidden">Byahishwe (hidden)</option>
    <option value="new">Nshya (new)</option>
  </select>
  <span id="count" class="note"></span>
  <span style="flex:1"></span>
  <button class="ghost" id="addNew">+ Kongeramo ikibazo</button>
  <button id="export">Pakurura overrides.json</button>
</header>

<div class="wrap">
  <div class="list" id="list"></div>
  <div class="editor" id="editor"><div class="empty">Hitamo ikibazo ibumoso. / Pick a question on the left.</div></div>
</div>

<script>
const LETTERS = ["a","b","c","d","e","f"];
let records = [];          // parsed bank
let overrides = { patch:{}, hide:[], add:[] };
let selectedId = null;
let adding = false;
let pendingImage = undefined;   // undefined = untouched, "" = removed, dataURL = new upload
let newImage = undefined;       // upload for a brand-new question

const $ = (s) => document.querySelector(s);

function statusOf(r) {
  if (overrides.hide.includes(r.id)) return "hidden";
  if (overrides.patch[r.id]) return "edited";
  if (r.status === "verified") return "verified";
  return r.status; // needs_key / bad_options / duplicate / needs_image
}

function currentOf(r) {
  const p = overrides.patch[r.id] || {};
  return {
    question: p.question ?? r.question,
    options: (p.options ?? r.options.map(o => o.text)),
    answer: p.answer ?? r.answer,
    topic: p.topic ?? "",
    image: p.image ?? (p.imageData || r.image || ""),
    explanation: p.explanation ?? r.explanation ?? ""
  };
}

function attention(r) {
  const s = statusOf(r);
  return s === "attention" || s === "hidden" || s === "needs_key" || s === "bad_options" || s === "duplicate" || s === "needs_image";
}

function visibleRecords() {
  const q = $("#search").value.trim().toLowerCase();
  const f = $("#filter").value;
  return records.filter(r => {
    if (q && !(r.question + " " + (overrides.patch[r.id]?.question || "")).toLowerCase().includes(q)) return false;
    const s = statusOf(r);
    if (f === "all") return true;
    if (f === "verified") return s === "verified" || s === "edited";
    if (f === "edited") return s === "edited";
    if (f === "attention") return attention(r);
    if (f === "hidden") return s === "hidden";
    return true;
  });
}

function renderList() {
  const list = $("#list");
  const items = visibleRecords();
  $("#count").textContent = items.length + " / " + records.length + " ibibazo";
  list.innerHTML = items.map(r => {
    const s = statusOf(r);
    const cur = currentOf(r);
    return `<div class="row ${r.id === selectedId ? "active" : ""}" data-id="${r.id}">
      <div class="t"><span class="pill ${s}">${s}</span><span>#${r.source_number}</span><span>${r.id}</span></div>
      <div class="q">${esc(cur.question.slice(0, 90))}</div>
    </div>`;
  }).join("") || `<div class="empty">Nta kibazo kibonetse.</div>`;
  list.querySelectorAll(".row").forEach(el => el.onclick = () => { adding = false; selectedId = el.dataset.id; pendingImage = undefined; renderList(); renderEditor(); });
}

function renderEditor() {
  if (adding) return renderEditorNew();
  const r = records.find(x => x.id === selectedId);
  if (!r) { $("#editor").innerHTML = `<div class="empty">Hitamo ikibazo ibumoso.</div>`; return; }
  const s = statusOf(r);
  const cur = currentOf(r);
  const orig = `Original (${r.status}${r.answer ? ", key " + r.answer : ""}):\n${r.question}\n` +
    r.options.map((o, i) => `${LETTERS[i]}) ${o.text}`).join("\n");

  $("#editor").innerHTML = `
    ${s === "needs_key" ? `<div class="banner">Iki kibazo nta gisubizo cyanditse mu nkomoko. Hitamo igisubizo cy'ukuri ukande "Bika".</div>` : ""}
    ${s === "bad_options" ? `<div class="banner">Amahitamo y'iki kibazo ntabwo yumvikana (ashobora kuba ari amashusho). Andika amahitamo uko bikwiye.</div>` : ""}
    <div class="t" style="color:var(--muted);font-size:12px">#${r.source_number} · ${r.id} · ${r.page ? "p." + r.page : ""}</div>

    <label>Ikibazo (question)</label>
    <textarea id="f_q" rows="3">${esc(cur.question)}</textarea>

    <label>Amahitamo n'igisubizo cy'ukuri</label>
    ${LETTERS.slice(0, Math.max(4, cur.options.length)).map((L, i) => `
      <div class="opt-row">
        <input type="radio" name="ans" value="${L}" ${cur.answer === L ? "checked" : ""}>
        <span class="letter">${L}</span>
        <input data-opt="${i}" value="${esc(cur.options[i] || "")}" placeholder="hitamo ${L}">
      </div>`).join("")}

    <label>Icyiciro (topic)</label>
    <select id="f_topic">
      <option value="">(auto)</option>
      ${["signs","lights","speed","priority","docs","safety"].map(t => `<option value="${t}" ${cur.topic === t ? "selected" : ""}>${t}</option>`).join("")}
    </select>

    <label>Ifoto (image)</label>
    <div class="imgrow">
      <div class="thumb" id="f_thumb">${cur.image ? `<img src="${esc(cur.image)}" alt="">` : `<span>nta foto</span>`}</div>
      <div class="imgctl">
        <input type="file" id="f_file" accept="image/*">
        <input id="f_img" value="${esc(cur.image)}" placeholder="assets/q/... (path y'ifoto)">
        <button class="ghost" id="f_clear" type="button">Kuraho ifoto</button>
        <span class="note">Hitamo ifoto mu mudasobwa; izinjizwa muri overrides.json hanyuma ishyirwe muri assets/q.</span>
      </div>
    </div>

    <label>Ibisobanuro (explanation, optional)</label>
    <textarea id="f_exp" rows="2">${esc(cur.explanation)}</textarea>

    <label>Nkomoko / original</label>
    <div class="orig">${esc(orig)}</div>

    <div class="btns goto">
      <button id="save">Bika (save)</button>
      <button class="ghost" id="reset">Subiza ku nkomoko (reset)</button>
      ${s === "hidden"
        ? `<button class="ghost" id="unhide">Garuka (unhide)</button>`
        : `<button class="danger" id="hide">Kuraho (hide from app)</button>`}
    </div>`;

  $("#save").onclick = () => saveCurrent(r);
  $("#reset").onclick = () => { delete overrides.patch[r.id]; pendingImage = undefined; renderList(); renderEditor(); };
  if ($("#hide")) $("#hide").onclick = () => { if (!overrides.hide.includes(r.id)) overrides.hide.push(r.id); delete overrides.patch[r.id]; renderList(); renderEditor(); };
  if ($("#unhide")) $("#unhide").onclick = () => { overrides.hide = overrides.hide.filter(x => x !== r.id); renderList(); renderEditor(); };
  $("#f_file").onchange = (e) => readImage(e.target.files[0], (dataUrl) => {
    pendingImage = dataUrl;
    $("#f_img").value = "";
    $("#f_thumb").innerHTML = `<img src="${dataUrl}" alt="">`;
  });
  $("#f_clear").onclick = () => {
    pendingImage = "";
    $("#f_img").value = "";
    $("#f_thumb").innerHTML = `<span>nta foto</span>`;
  };
}

function saveCurrent(r) {
  const q = $("#f_q").value.trim();
  const opts = [...document.querySelectorAll("[data-opt]")].map(el => el.value.trim());
  const ans = document.querySelector('input[name=ans]:checked')?.value || null;
  const existing = overrides.patch[r.id] || {};
  const patch = {};

  if (q && q !== r.question) patch.question = q;
  const origOpts = r.options.map(o => o.text);
  if (JSON.stringify(opts) !== JSON.stringify(origOpts)) patch.options = opts;
  if (ans && ans !== r.answer) patch.answer = ans;

  const topic = $("#f_topic").value;
  if (topic) patch.topic = topic;

  const exp = $("#f_exp").value.trim();
  if (exp !== (r.explanation || "")) patch.explanation = exp;

  // Image: an explicit upload/remove wins; otherwise keep a prior upload or a
  // changed path.
  const effPath = $("#f_img").value.trim();
  if (pendingImage !== undefined) {
    if (pendingImage) patch.imageData = pendingImage;
    else patch.image = "";
  } else if (existing.imageData && !effPath) {
    patch.imageData = existing.imageData;
  } else if (effPath !== (r.image || "")) {
    patch.image = effPath;
  }

  overrides.patch[r.id] = patch;
  overrides.hide = overrides.hide.filter(x => x !== r.id);
  renderList();
  flash("Byabitswe. / Saved.");
}

function readImage(file, done) {
  if (!file) return;
  if (file.size > 3 * 1024 * 1024) return flash("Ifoto ni nini cyane (max 3 MB).", true);
  const reader = new FileReader();
  reader.onload = () => done(reader.result);
  reader.readAsDataURL(file);
}

function renderEditorNew() {
  $("#editor").innerHTML = `
    <div class="banner">Ikibazo gishya. Kizongerwa kuri banki igihe uzapakura overrides.json.</div>
    <label>Ikibazo</label><textarea id="n_q" rows="3"></textarea>
    <label>Amahitamo n'igisubizo</label>
    ${LETTERS.slice(0,4).map((L,i)=>`<div class="opt-row"><input type="radio" name="nans" value="${i}" ${i===0?"checked":""}><span class="letter">${L}</span><input data-nopt="${i}"></div>`).join("")}
    <label>Icyiciro</label>
    <select id="n_topic">${["signs","lights","speed","priority","docs","safety"].map(t=>`<option>${t}</option>`).join("")}</select>
    <label>Ifoto (optional)</label>
    <div class="imgrow">
      <div class="thumb" id="n_thumb"><span>nta foto</span></div>
      <div class="imgctl">
        <input type="file" id="n_file" accept="image/*">
        <input id="n_img" placeholder="assets/q/... (path, ushobora gusiga ubusa)">
      </div>
    </div>
    <label>Ibisobanuro (optional)</label><textarea id="n_exp" rows="2"></textarea>
    <div class="btns"><button id="n_save">Ongeraho</button><button class="ghost" id="n_cancel">Reka</button></div>`;
  $("#n_cancel").onclick = () => { adding = false; renderEditor(); };
  $("#n_file").onchange = (e) => readImage(e.target.files[0], (dataUrl) => {
    newImage = dataUrl;
    $("#n_img").value = "";
    $("#n_thumb").innerHTML = `<img src="${dataUrl}" alt="">`;
  });
  $("#n_save").onclick = () => {
    const q = $("#n_q").value.trim();
    const options = [...document.querySelectorAll("[data-nopt]")].map(el => el.value.trim()).filter(Boolean);
    if (!q || options.length < 2) return flash("Uzuza ikibazo nibura amahitamo 2.", true);
    const answer = Number(document.querySelector("input[name=nans]:checked").value);
    const entry = { id: "NEW-" + String(overrides.add.length + 1).padStart(3,"0"), question: q, options, answer, topic: $("#n_topic").value };
    if (newImage) entry.imageData = newImage;
    else if ($("#n_img").value.trim()) entry.image = $("#n_img").value.trim();
    if ($("#n_exp").value.trim()) entry.explanation = $("#n_exp").value.trim();
    overrides.add.push(entry);
    newImage = undefined;
    adding = false; renderEditor(); flash("Byongewe. / Added.");
  };
}

function flash(msg, bad) {
  const el = document.createElement("div");
  el.className = "banner";
  el.style.background = bad ? "#3b1212" : "#123b2a";
  el.style.borderColor = bad ? "#6b1c1c" : "#1c6b45";
  el.style.color = bad ? "#fecaca" : "#bbf7d0";
  el.textContent = msg;
  $("#editor").prepend(el);
}

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }

async function load() {
  const res = await fetch("../data/questions.rw.json");
  records = await res.json();
  try {
    const o = await fetch("../data/overrides.json");
    if (o.ok) overrides = await o.json();
  } catch (e) { /* no overrides yet */ }
  overrides.patch ||= {}; overrides.hide ||= []; overrides.add ||= [];
  renderList();
}

$("#search").oninput = renderList;
$("#filter").onchange = renderList;
$("#addNew").onclick = () => { adding = true; selectedId = null; newImage = undefined; renderEditor(); };
$("#export").onclick = () => {
  const blob = new Blob([JSON.stringify(overrides, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "overrides.json";
  a.click();
};

load();
</script>
</body>
</html>
